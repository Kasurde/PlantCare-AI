<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Log in — PlantCare AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="page">

  <nav class="nav">
    <a class="brand" href="{{ url_for('index') }}">
      <svg class="brand-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 24C13 24 4 19.5 4 11.5C4 6.5 8 3 13 3C13 3 13 15 13 24Z" fill="#6B9C4B"/>
        <path d="M13 24C13 24 22 19.5 22 11.5C22 6.5 18 3 13 3C13 3 13 15 13 24Z" fill="#4F7A38"/>
        <path d="M13 5V22" stroke="#16281F" stroke-width="0.7" stroke-linecap="round"/>
      </svg>
      PlantCare AI
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Diagnose</a>
      <a href="{{ url_for('register') }}">Sign up</a>
    </div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h1>Log in</h1>
      <p class="sub">Pick up where you left off with your diagnosis history.</p>

      <form action="{{ url_for('login') }}" method="POST">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="asha@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••">
        </div>
        <button class="btn btn-primary btn-full" type="submit">Log in</button>
      </form>

      <div class="auth-foot">New to PlantCare AI? <a href="{{ url_for('register') }}">Create an account</a></div>
    </div>
  </div>

  <footer class="site-foot">PlantCare AI — built for early detection, not a substitute for agronomic advice.</footer>
</div>
</body>
</html>
